# general settings
name: NAFNet-PSF-DIV2K-width64
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: DIV2K-PSF-train
    type: DIV2KPSFDataset
    dataroot_gt: ./datasets/DIV2K/DIV2K_train_HR
    psf_dir: ./npz_07131

    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true
    use_xy: false

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: DIV2K-PSF-val
    type: DIV2KPSFDataset
    dataroot_gt: ./datasets/DIV2K/DIV2K_valid_HR
    psf_dir: ./npz_07131
    io_backend:
      type: disk
    gt_size: 256
    use_flip: false
    use_rot: false
    use_xy: false
    phase: val


network_g:
  type: NAFNetLocal
  width: 64
  img_channel: 3
  out_channel: 3
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

# path
path:
  root: /mnt/Project
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 200000
    eta_min: !!float 1e-7

  total_iter: 200000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 2e4
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
